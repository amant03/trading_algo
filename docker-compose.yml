# Full TradeAlgo stack on 100% free + open-source software.
# Run on an Oracle Cloud Always-Free VM (free forever, not a trial):
#   VM.Standard.A1.Flex, 4 OCPU / 24 GB RAM, Ubuntu 24.04, 50 GB boot volume.
# Images: postgres:16-alpine, adminer, apache/kafka (KRaft, single node),
# caddy:2-alpine, plus our own services built from docker/Dockerfile.svc.
# Boot:  scripts/cloud-init.sh  (pasted as the VM's user-data script), or:
#   cp .env.example .env   # then set real secrets + DOMAIN
#   sed 's/__DOMAIN__/YOUR.nip.io/' docker/Caddyfile.tmpl > docker/Caddyfile
#   docker compose up -d --build

x-common-env: &common-env
  NODE_ENV: production
  PGHOST: postgres
  PGPORT: 5432
  PGDATABASE: ${PGDATABASE}
  PGUSER: ${PGUSER}
  PGPASSWORD: ${PGPASSWORD}
  KAFKA_BROKERS: kafka:9092
  KAFKA_CLIENT_ID: trading-cloud
  JWT_SECRET: ${JWT_SECRET}
  REAL_DATA: '1'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER} -d ${PGDATABASE}']
      interval: 10s
      timeout: 5s
      retries: 10

  # DB admin UI (open-source, single file). NOT published; use an SSH tunnel:
  #   ssh -L 8080:localhost:8080 ubuntu@<vm-ip>   ->  http://localhost:8080
  #   system: PostgreSQL, server: postgres, user/pass from .env
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 > /dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *common-env
      API_PORT: 8080
    command: ['sh', '-c', 'npx tsx scripts/db/apply-schema.ts && exec npx tsx services/api/src/index.ts']

  executor:
    build:
      context: .
      dockerfile: docker/Dockerfile.svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment: *common-env
    command: ['npx', 'tsx', 'services/executor/src/index.ts']

  market-data:
    build:
      context: .
      dockerfile: docker/Dockerfile.svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment: *common-env
    command: ['npx', 'tsx', 'services/market-data/src/index.ts']

  fundamentals:
    build:
      context: .
      dockerfile: docker/Dockerfile.svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment: *common-env
    command: ['npx', 'tsx', 'services/fundamentals/src/index.ts']

  algorithm-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment: *common-env
    command: ['npx', 'tsx', 'services/algorithm-engine/src/index.ts']

  news:
    build:
      context: .
      dockerfile: docker/Dockerfile.svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment: *common-env
    command: ['npx', 'tsx', 'services/news/src/index.ts']

  # TLS terminator (Caddy, Apache-2.0): automatic Let's Encrypt certs for
  # DOMAIN. Only ports 80/443 need to be open on the VM + VCN security list.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  pgdata:
  kafkadata:
  caddydata:
  caddyconfig:
