name: Backend Automation

on:
  schedule:
    # Market-hours news runs: every 2 hours during the NSE cash session
    # (10:00 / 12:00 / 14:00 IST, Mon–Fri). Cheap: Google News RSS + a small
    # symbol cap — no DB, no services. Prices stream separately via the
    # frontend /api/live + /api/chart relays.
    - cron: '30 4,6,8 * * 1-5'
    # Once-a-day deep run (03:00 IST): strategy window + report + fundamentals
    # (DB seed + nightly market-cap-ordered coverage batch) + management +
    # full-set news. Also promotes the snapshot to main.
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: backend-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading_app
          POSTGRES_PASSWORD: trading_pass
          POSTGRES_DB: trading_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_app -d trading_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 > /dev/null 2>&1 || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15

    env:
      KAFKAJS_NO_PARTITIONER_WARNING: 1
      # Real NSE data overlay (Yahoo Finance, free): real daily history +
      # live quotes on top of the simulated 1m feed that drives strategies.
      REAL_DATA: '1'

    steps:
      - name: Resolve run mode
        run: |
          if [ "${{ github.event.schedule }}" = "30 4,6,8 * * 1-5" ]; then
            echo "MODE=news" >> "$GITHUB_ENV"
          else
            echo "MODE=full" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ---- market-hours news only (no DB / services / fundamentals) -------
      - name: Refresh per-stock news (market hours)
        if: env.MODE == 'news'
        run: node node_modules/tsx/dist/cli.mjs scripts/ci/news.ts
        env:
          NEWS_MAX_SYMBOLS: '40'

      # ---- full pipeline (once a day + manual) ----------------------------
      - name: Apply database schema
        if: env.MODE == 'full'
        run: node node_modules/tsx/dist/cli.mjs scripts/db/apply-schema.ts

      - name: Start backend services
        if: env.MODE == 'full'
        run: |
          mkdir -p .infra/logs
          for svc in market-data fundamentals news algorithm-engine executor api; do
            node node_modules/tsx/dist/cli.mjs services/$svc/src/index.ts \
              > .infra/logs/$svc.log 2>&1 &
            echo "Started $svc (PID $!)"
          done

      - name: Wait for services to initialize
        if: env.MODE == 'full'
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start within 120s"
          for f in .infra/logs/*.log; do echo "===== $f ====="; tail -30 "$f"; done
          exit 1

      - name: Verify pipeline boot
        if: env.MODE == 'full'
        run: |
          echo "=== Health ==="
          curl -sf http://127.0.0.1:8080/api/health | jq .
          echo "=== Overview ==="
          curl -sf http://127.0.0.1:8080/api/market/overview | jq '{index: .index.price, adv: .market.advancers, dec: .market.decliners}'

      # Monitored window: polls the DB, exits early once strategies produce
      # signals AND the executor trades. Fails loudly if the brain is silent.
      - name: Run pipeline window (monitored)
        if: env.MODE == 'full'
        run: node node_modules/tsx/dist/cli.mjs scripts/ci/monitor.ts

      - name: Generate report + UI snapshot
        if: env.MODE == 'full'
        run: node node_modules/tsx/dist/cli.mjs scripts/ci/report.ts

      # Carry the previous run's analysis forward (the nightly batch grows the
      # coverage set monotonically; this file is the source of truth).
      - name: Pre-stage previous analyst model
        if: env.MODE == 'full'
        run: |
          curl -sfL https://raw.githubusercontent.com/amant03/trading_algo/automation-data/frontend/public/analysis.json \
            -o frontend/public/analysis.json || echo "no previous analysis to carry"

      # Deep fundamentals: DB seed + next market-cap-ordered coverage batch
      # from universe.json (COVERAGE_BATCH, default 40/night) -> analysis.json
      - name: Generate fundamentals & analyst model
        if: env.MODE == 'full'
        run: node node_modules/tsx/dist/cli.mjs scripts/ci/fundamentals.ts

      # Management analysis: officers + litigation scan appended to analysis.json.
      - name: Generate management analysis
        if: env.MODE == 'full'
        run: node node_modules/tsx/dist/cli.mjs scripts/ci/management.ts

      # Per-stock news for the whole covered set (Google News RSS), merged with
      # the previous 7-day window into frontend/public/news.json.
      - name: Refresh per-stock news (deep run)
        if: env.MODE == 'full'
        run: node node_modules/tsx/dist/cli.mjs scripts/ci/news.ts
        env:
          NEWS_MAX_SYMBOLS: '150'

      - name: Job summary
        if: always()
        run: |
          if [ -f scripts/ci/report-latest.json ]; then
            {
              echo "## Pipeline report ($(date -u '+%Y-%m-%d %H:%M UTC'))"
              echo '```json'
              cat scripts/ci/report-latest.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload service logs
        if: env.MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs-${{ github.run_id }}
          path: .infra/logs/
          retention-days: 14

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: scripts/ci/report-latest.json
          retention-days: 30
          if-no-files-found: ignore

      # Audit trail: commit the run's artifacts to `automation-data` (the
      # deployed UI reads the latest snapshot straight from there — no redeploy
      # needed). Market-hours runs only touch news.json; deep runs also bump
      # snapshot/analysis and promote to main daily / on manual runs.
      - name: Commit audit trail & UI snapshot
        run: |
          git config user.name "automation-bot"
          git config user.email "actions@github.com"
          mkdir -p reports
          if [ "${{ env.MODE }}" = "full" ]; then
            ts=$(date -u +%Y%m%d-%H%M%S)
            cp scripts/ci/report-latest.json "reports/run-$ts-$GITHUB_RUN_ID.json" 2>/dev/null || true
            cp scripts/ci/report-latest.json reports/latest.json 2>/dev/null || true
            git add reports/ 2>/dev/null || true
          fi
          git add frontend/public/snapshot.json 2>/dev/null || true
          git add frontend/public/analysis.json 2>/dev/null || true
          git add frontend/public/news.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "chore(automation): pipeline report #$GITHUB_RUN_NUMBER"
          # automation-data is an append-only artifact branch — concurrent runs
          # can race, so force the ref to the latest snapshot (last-writer-wins).
          git push --force origin HEAD:automation-data
          if [ "${{ env.MODE }}" = "full" ] && { [ "${{ github.event.schedule }}" = "30 21 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            git push origin HEAD:main || echo "main moved concurrently — snapshot stays on automation-data branch"
          fi