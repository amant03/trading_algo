    <script>
      (function () {
        var origin = location.origin;
        if (!origin || origin === "null") return;
        var here = origin + location.pathname;
        function upgrade(selector, attr) {
          var el = document.head.querySelector(selector);
          if (!el) return;
          var value = el.getAttribute(attr) || "";
          if (value.indexOf("http") === 0) return;
          if (attr === "href" || selector.indexOf("og:url") !== -1) el.setAttribute(attr, here);
          else el.setAttribute(attr, origin + (value.charAt(0) === "/" ? value : "/" + value));
        }
        upgrade('link[rel="canonical"]', "href");
        upgrade('meta[property="og:url"]', "content");
        upgrade('meta[property="og:image"]', "content");
        upgrade('meta[name="twitter:image"]', "content");
      })();
    </script>
